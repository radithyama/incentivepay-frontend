server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't hand out the exact nginx version - Caddy also strips the Server
    # header entirely in front of this, but this is the source-level fix.
    server_tokens off;

    # SPA fallback - client-side routing has nothing to route here (App.tsx
    # uses tab state, not a router), but this keeps a hard refresh on any
    # deep link working if that changes later.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
